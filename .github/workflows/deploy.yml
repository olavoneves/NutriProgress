name: CD — Deploy to Render

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger deploy on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering deploy on Render..."

          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -d '{"clearCache": false}')

          if [ "$response" = "201" ]; then
            echo "Deploy triggered successfully!"
          else
            echo "Deploy trigger failed with status: $response"
            exit 1
          fi

      - name: Wait for deploy to complete
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Waiting for deploy to complete..."
          sleep 30

          MAX_ATTEMPTS=20
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            STATUS=$(curl -s \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); \
                            print(d[0]['deploy']['status'] if d else 'unknown')")

            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Deploy status: $STATUS"

            case "$STATUS" in
              live)
                echo "Deploy completed successfully!"
                exit 0
                ;;
              failed|canceled)
                echo "Deploy failed with status: $STATUS"
                exit 1
                ;;
              *)
                sleep 15
                ATTEMPT=$((ATTEMPT + 1))
                ;;
            esac
          done

          echo "Deploy timed out after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Verify production health
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          echo "Verifying production health..."
          sleep 10

          response=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "$APP_URL/health/ping")

          if [ "$response" = "200" ]; then
            echo "Production health check passed!"
          else
            echo "Production health check failed: HTTP $response"
            exit 1
          fi

      - name: Notify success
        if: success()
        run: echo "Deploy to production completed successfully!"

      - name: Notify failure
        if: failure()
        run: echo "Deploy to production failed!"
