name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main, release]

jobs:
  backend:
    name: Backend — Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nutri_progress_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: ./mvnw verify --no-transfer-progress
        env:
          DATASOURCE_USERNAME: root
          DB_PASSWORD: root
          JWT_TOKEN_SECRET: ci-test-secret-at-least-32-chars-long
          JWT_ACCESS_TOKEN_EXPIRATION: 15
          JWT_REFRESH_TOKEN_EXPIRATION: 10080
          EMAIL_BIOGURT: test@test.com
          SENHA_LD: test

  frontend:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build
