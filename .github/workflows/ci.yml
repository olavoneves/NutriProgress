name: CI — Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main, release]

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1024m'

jobs:

  # ============================================================
  # BACKEND — Test
  # ============================================================
  backend-test:
    name: Backend — Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: |
          ./mvnw verify \
            -B \
            --no-transfer-progress \
            -Dspring.profiles.active=test
        env:
          JWT_SECRET: ci-test-secret-at-least-512-bits-long-do-not-use-in-production-ever

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            server/target/surefire-reports/
            server/target/failsafe-reports/
          retention-days: 7

  # ============================================================
  # FRONTEND — Lint, Type-check & Build
  # ============================================================
  frontend:
    name: Frontend — Lint, Type-check & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check & build
        run: npm run build

  # ============================================================
  # BACKEND — Build Docker Image (only on main)
  # ============================================================
  backend-docker:
    name: Backend — Build Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: server
        run: |
          ./mvnw clean package \
            -DskipTests \
            -B \
            --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriprogress-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nutriprogress-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
