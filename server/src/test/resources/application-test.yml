spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nutriprogress_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:test-only-secret-key-at-least-64-characters-long-do-not-use-in-production-xxxxx}

logging:
  level:
    com.nutriprogress: WARN
    org.hibernate.SQL: WARN
