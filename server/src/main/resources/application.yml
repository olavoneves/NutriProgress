spring:
  application:
    name: nutriprogress-api

  profiles:
    active: ${SPRING_PROFILE:dev}

  jpa:
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2
        default-requeue-rejected: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@nutriprogress.com}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/nutriprogress_analytics}
      auto-index-creation: true

  task:
    execution:
      pool:
        core-size: 4
        max-size: 10
        queue-capacity: 200
      thread-name-prefix: async-

server:
  port: ${PORT:8080}
  compression:
    enabled: true

logging:
  level:
    root: INFO
    com.nutriprogress: DEBUG

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key}
  expiration: 900000        # 15 minutos
  refresh-expiration: 604800000  # 7 dias
  issuer: nutriprogress-api

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:your-google-client-id}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  price:
    starter: ${STRIPE_PRICE_STARTER:price_placeholder}
    pro: ${STRIPE_PRICE_PRO:price_placeholder}
    premium: ${STRIPE_PRICE_PREMIUM:price_placeholder}

app:
  url: ${APP_URL:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health, info, prometheus, metrics, loggers
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:dev}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: NutriProgress API
    version: "@project.version@"
    description: SaaS para acompanhamento nutricional
