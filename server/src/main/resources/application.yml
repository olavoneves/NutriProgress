spring:
  application:
    name: nutriprogress-api

  profiles:
    active: ${SPRING_PROFILE:dev}

  jpa:
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  compression:
    enabled: true

logging:
  level:
    root: INFO
    com.nutriprogress: DEBUG

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key}
  expiration: 900000        # 15 minutos
  refresh-expiration: 604800000  # 7 dias

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
