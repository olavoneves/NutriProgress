spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nutriprogress_dev
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.nutriprogress: DEBUG
    org.hibernate.SQL: DEBUG
